# Dart 側と Kotlin 側を別ジョブで回す。
#
# 両者は同じワイヤ表現を別言語で手書きしている（設計 §9.1）。
# 片方だけ緑になっても意味が無いので、`protocol-version` ジョブで
# 定数の突合を、各テストジョブで共有ゴールデン
# （packages/fluse_protocol/test/fixtures/wire_golden.json）の突合を行う。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの push が続いたときは古い実行を打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kotlin 2.1 系のコンパイラは新しすぎる JDK を解釈できない。
  # ここを上げるときは build.gradle.kts の jvmToolchain も合わせる。
  JAVA_VERSION: "17"

jobs:
  # 正規表現だけで完結するので最初に落ちてほしい。テスト環境の
  # 準備を待たずに「版がずれている」と分かる。
  #
  # `tool/` はワークスペースのメンバではなく melos の format / analyze が
  # 届かない。ここで面倒を見る。
  protocol-version:
    name: protocolVersion 突合
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ルートの `dart pub get` はワークスペース全体を解決する。
      # fluse_runtime が Flutter プラグインなので Flutter が要る。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 依存解決
        run: flutter pub get

      - name: tool/ のフォーマット検査
        run: dart format --output=none --set-exit-if-changed tool

      - name: tool/ の静的解析
        run: dart analyze --fatal-infos --fatal-warnings tool

      - name: 突合
        run: dart run tool/check_protocol_version.dart

  dart:
    name: Dart (analyze / format / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fluse_runtime が Flutter プラグインになったため、素の Dart SDK では
      # `flutter: sdk: flutter` を解決できない。ワークスペース全体の解決に
      # Flutter が要る。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # pub workspaces なのでルートの 1 回でメンバ全部が解決される。
      - name: 依存解決
        run: flutter pub get

      - name: フォーマット検査
        run: dart run melos run format

      - name: 静的解析
        run: dart run melos run analyze

      - name: テスト
        run: dart run melos run test

  kotlin:
    name: Kotlin (gradle test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fluse_protocol_kt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # WireGoldenTest が ../fluse_protocol/test/fixtures/wire_golden.json を
      # 相対パスで読む。checkout 済みのリポジトリ内なので追加の準備は要らない。
      - name: テスト
        run: ./gradlew test --no-daemon

  # fluse_runtime の Android プラグイン。Kotlin の単体テストを回す。
  #
  # プラグイン単体では Flutter エンジンの成果物が無くビルドできない。
  # 例示アプリの Android プロジェクト経由で叩くのが確実な経路
  # （プラグインリポジトリで一般的な方法）。
  runtime-android:
    name: fluse_runtime (Android unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # プラグインの解決には example 側の pub get が要る。
      - name: 依存解決
        working-directory: examples/counter_app
        run: flutter pub get

      - name: Kotlin の単体テスト
        working-directory: examples/counter_app/android
        run: ./gradlew :fluse_runtime:testDebugUnitTest --no-daemon

  # 言語をまたぐ L1統合テスト（Task 2.5）。Dart と JDK の両方が要るため、
  # dart / kotlin ジョブとは別に1ランナーへ揃える。
  #
  # 既存の dart ジョブでもこのテストは発見されるが、JVM ハーネスが
  # ビルドされていないので markTestSkipped で自己スキップする。
  l1-integration:
    name: L1統合テスト（トンネル 10MB 双方向）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L1 テストは fluse_server（純 Dart）だが、ワークスペースの解決に
      # Flutter が要る（fluse_runtime がプラグインのため）。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: 依存解決
        run: flutter pub get

      # Dart 側テストは build/install/fluse_protocol_kt/bin/fluse_protocol_kt を
      # 既定規約のパスで探す。場所を変えるとテスト側もスキップに倒れる。
      - name: JVM ハーネスのビルド
        working-directory: packages/fluse_protocol_kt
        run: ./gradlew installDist --no-daemon

      - name: L1統合テスト
        working-directory: packages/fluse_server
        run: dart test test/tunnel_l1_integration_test.dart -r expanded
