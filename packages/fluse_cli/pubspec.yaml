name: fluse_cli
description: fluse コマンド本体。init / start / rebuild / doctor / devices の解析、QR 描画、コンソールUI、ライフサイクル統括を担う。
version: 0.1.0
# pub.dev への公開は Task 7.3 でまとめて解禁する。
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  # コマンドとオプションの解析。
  args: ^2.7.0
  # プロジェクト解析・指紋・ビルド・端末への導入（設計 §2.1）。
  fluse_builder: ^0.1.0
  # 通信契約と、ビルド時フラグの記録。
  fluse_protocol: ^0.1.0
  # ログとサーバ本体。
  fluse_server: ^0.1.0
  # パス結合。Windows の区切りを正しく扱うため自前の文字列結合は使わない。
  path: ^1.9.0
  # QR の生成。**描画は自前でやる。** このパッケージが持つのは行列まで。
  qr: ^3.0.2
  # 外部プロセスの抽象。テストから差し替える。
  process: ^5.0.5
  # fluse.yaml の解析。自前で行を読むと、複数行やアンカーで崩れる。
  yaml: ^3.1.0
  # fluse.yaml への書き戻し。**全体を書き直さない。** 再シリアライズすると
  # 利用者のコメントと並びが失われる（設計 §10-8）。
  yaml_edit: ^2.2.4

dev_dependencies:
  test: ^1.26.0
