name: fluse_builder
description: Flutter SDK 解決・プロジェクト解析・指紋計算・エントリポイント生成・keystore 管理・APK ビルドと端末インストールを担う。
version: 0.1.0
# pub.dev への公開は Task 7.3 でまとめて解禁する。
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  # 通信契約と、ビルド時フラグの記録（設計 §2.1 のレイヤリング）。
  fluse_protocol: ^0.1.0
  # 指紋の sha256。自前で実装しない。
  crypto: ^3.0.6
  # パス結合。Windows の区切りを正しく扱うため自前の文字列結合は使わない。
  path: ^1.9.0
  # 外部プロセス（flutter / adb / keytool）の抽象。fluse_server とは
  # 独立に同じパッケージへ依存する（設計 §2.1 のレイヤリングを保つため）。
  process: ^5.0.5
  # pubspec.yaml の解析。自前で行を読むと、複数行やアンカーで崩れる。
  yaml: ^3.1.0
  # pubspec.yaml への追記。**全体を書き直さない。** 再シリアライズすると
  # 利用者のコメントと並びが失われる（設計 §10-8）。
  yaml_edit: ^2.2.4

dev_dependencies:
  # FakeProcessManager を再利用するためのテスト専用依存。
  # 本番の依存グラフには入らない。
  fluse_server: ^0.1.0
  test: ^1.26.0
