name: fluse_runtime
description: ユーザープロジェクトの dev_dependencies に入る端末側ランタイム。接続・トンネル・エラー表示を担う。
version: 0.1.0
# pub.dev への公開は Task 7.3 でまとめて解禁する。
publish_to: none

environment:
  sdk: ^3.9.0
  # **3.29.0 未満では使えない。** dev_dependency のプラグインを release から
  # 実際に外すようになったのは 3.29.0 から（flutter/flutter#161343、
  # `818133b8b03`。それ以前は `.flutter-plugins-dependencies` に印は付くが、
  # Android の release ビルドから外れない）。ここを下げると、release の APK に
  # 端末側ランタイムが入る余地ができる（設計 §6.2）。
  flutter: '>=3.29.0'

resolution: workspace

dependencies:
  # MethodChannel と WidgetsFlutterBinding。
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        # Kotlin 側の package。fluse_protocol_kt と同じ名前に揃えてある。
        package: dev.fluse.runtime
        pluginClass: FluseRuntimePlugin
