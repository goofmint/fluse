# CodeRabbit 設定 — fluse (Flutter Preview Client) モノレポ
# schema: https://www.coderabbit.ai/integrations/schema.v2.json
#
# 注意: CodeRabbit には Dart / Flutter 用のリンター連携が存在しない。
# 各パッケージの analysis_options.yaml は CodeRabbit 側には反映されないため、
# 規約チェックは下記 path_instructions に書いた分だけが効く。

language: "ja"
early_access: true

reviews:
  request_changes_workflow: true
  poem: true

  path_filters:
    # ビルド成果物・ツール生成物
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/pubspec.lock"
    - "!**/*.iml"
    - "!**/.idea/**"
    # Flutter が生成するプラットフォーム別ディレクトリ
    - "!examples/**/android/**"
    - "!examples/**/ios/**"
    - "!examples/**/web/**"
    - "!examples/**/macos/**"
    - "!examples/**/windows/**"
    - "!examples/**/linux/**"
    - "!**/gradlew"
    - "!**/gradlew.bat"
    - "!**/.flutter-plugins-dependencies"
    # コード生成物（build_runner 導入時に備える）
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    # 設計メモ・作業ディレクトリ・バイナリ
    - "!.tmp/**"
    - "!**/.flutter_preview/**"
    - "!**/*.png"
    - "!examples/**/assets/**"

  path_instructions:
    - path: "**/*.dart"
      instructions: |
        すべての Dart コードに適用する共通規約。

        【エラー処理・健全性】
        - フォールバック禁止。設定値・環境値・外部コマンド出力が取得できないときに
          `?? 'デフォルト値'` 等で黙って処理を継続してはならない。取得できなかった事実を
          明確なエラーとして表面化させること。
        - 例外の握りつぶし禁止。`catch (_) {}` や、ログ出力だけして処理を継続する catch を
          指摘すること。再送出するか、呼び出し元が判断できる型に変換すること。
        - null 安全性の回避禁止。`!`（bang 演算子）や `as` による強引なキャストで null 検査を
          迂回している箇所を指摘し、明示的な分岐か早期リターンを促すこと。
        - 未 await の Future を指摘すること。fire-and-forget が意図的なら理由をコメントで示し、
          そうでなければ await するか例外の受け皿を用意すること。

        【設計・ドキュメント】
        - マジックナンバーを排除すること。ポート番号・タイムアウト値・バッファサイズ・
          リトライ回数などは名前付き定数に切り出す。
        - パッケージが export する公開 API には `///` による dartdoc コメントを付けること。
        - パッケージ境界を守ること。他パッケージの `src/` 配下を直接 import してはならない。
          依存方向は fluse_protocol を最下層とし、fluse_builder / fluse_server /
          fluse_runtime がそれに依存、fluse_cli が上位に立つ構造を維持すること。
          逆方向の依存は指摘すること。
        - コメントは日本語で統一すること。英語コメントの混在を指摘すること。

    - path: "**/pubspec.yaml"
      instructions: |
        pub workspaces（Melos 8）で管理されたモノレポの構成ファイル。

        - workspace メンバー登録漏れ。新規パッケージ追加時にルート pubspec.yaml の
          `workspace:` への追加が漏れていないか（glob 未対応のため個別列挙が必須）。
        - 依存バージョンの整合性。パッケージ間で同じ依存のバージョン制約が矛盾していないか、
          SDK 制約が揃っているか。
        - 依存の配置先と方向。dependencies / dev_dependencies の取り違え、および依存方向の
          逆転（例: fluse_protocol が fluse_server に依存）を指摘すること。
        - publish_to / 公開設定。公開しないパッケージに `publish_to: none` があるか、
          逆に公開予定のパッケージに description / repository / homepage が揃っているか。

    - path: "packages/fluse_protocol/**"
      instructions: |
        サーバとランタイムが交わす制御メッセージ／トンネルフレームの定義・符号化・
        バージョンネゴシエーションを担う最下層パッケージ。

        【互換性】
        - 破壊的変更を検出すること。メッセージフィールドの削除・型変更・リネーム、
          列挙値の意味変更は breaking change として要約の先頭で明示する。
        - メッセージ定義を変更したのにプロトコルバージョン定数を更新していない場合は
          指摘すること。
        - バージョンネゴシエーションの後方互換性を確認すること。旧バージョンの server /
          runtime と接続した際の挙動と、非互換時のエラーメッセージが利用者に分かる内容かを
          見る。
        - 前方互換性を確認すること。未知のメッセージ種別や未知フィールドを受信しても
          クラッシュせず、無視または明示的なエラー応答になっているか。

        【符号化・健全性】
        - encode / decode の対称性（round-trip）を確認すること。片方だけ変更されている差分を
          指摘する。
        - 不正・切り詰められたフレームの検証を確認すること。長さ不足、不正ヘッダ、
          過大なペイロード長を受け取った際に安全に失敗するか。
        - フレーム長・オフセット計算の境界条件、バイト演算、エンディアンの誤りを見ること。
        - 依存方向の逆転を防ぐこと。fluse_server / fluse_cli / fluse_builder への依存が
          混入していないか確認する。

    - path: "packages/fluse_server/**"
      instructions: |
        増分コンパイル・DevFS 転送・VM Service 制御・TCP トンネル・WebSocket サーバ・
        セッション管理を担う開発PC側サーバ。

        【リソース管理・並行性】
        - Stream / Socket / Process の解放漏れを見ること。StreamSubscription の cancel、
          Socket / WebSocket の close、Process の kill が例外経路を含めて確実に行われるか
          （try-finally を伴っているか）。
        - セッションのライフサイクルを見ること。切断・再接続時にセッションが取り残されないか、
          二重登録や二重解放が起きないか。
        - 非同期処理の競合を見ること。未 await の Future、DevFS 転送と増分コンパイルの競合、
          共有状態への保護なしアクセス。
        - タイムアウトとキャンセルを見ること。VM Service 接続やトンネルの待ち合わせに
          タイムアウトがあるか、途中キャンセル時にリソースが残らないか。

        【ネットワーク・セキュリティ】
        - TCP トンネルの接続先検証。任意のホスト・ポートに中継できてしまわないか
          （SSRF 相当）。
        - WebSocket の認証・接続元制限。ローカル開発サーバとはいえ同一 LAN 内の第三者が
          接続できないか、トークン検証があるか。
        - ログへの機密情報漏えい。接続トークン、keystore パスワード、ユーザーソースの内容が
          ログに出ていないか。
        - 入力パスの検証。DevFS 転送対象のパスにトラバーサル（`../`）が混ざらないか、
          プロジェクトルート外を読まないか。

    - path: "packages/fluse_builder/**"
      instructions: |
        Flutter SDK 解決・プロジェクト解析・指紋計算・エントリポイント生成・keystore 管理・
        APK ビルドと端末インストールを担う。

        【外部プロセス実行・ビルド】
        - コマンドインジェクションを防ぐこと。flutter / gradle / adb の呼び出しで
          `runInShell: true` や文字列連結によるコマンド組み立てを使っていないか。
          引数は必ずリストで渡すこと。
        - 外部コマンドの失敗処理。終了コードを無視していないか、stderr を捨てていないか。
          失敗時に具体的な原因を利用者に提示できているか。
        - 指紋計算の妥当性。キャッシュキーに含めるべき入力（SDK バージョン、依存、
          ビルドフラグ）の漏れによって古い成果物を使い回してしまわないか。
        - SDK / ツールパス解決。Flutter SDK や adb が見つからない場合に黙って代替値を使う
          フォールバックが入っていないか。見つからないことを明確なエラーにすること。

        【keystore / secret】
        - secret のハードコーディング禁止。keystore パスワードやエイリアス名をソース・
          テスト・サンプルに直書きしていないか。
        - secret の出力先制御。ログ・例外メッセージ・エラー表示に keystore パスワードが
          混入しないか。マスク処理があるか。
        - 生成ファイルの配置先と権限。keystore や生成エントリポイントが `.flutter_preview/`
          内に閉じているか、パーミッションが適切か。
        - .gitignore への反映漏れ。新しく生成するようになった機密ファイルが gitignore 対象に
          なっているか（設計 §9.2）。

    - path: "packages/fluse_cli/**"
      instructions: |
        fluse コマンド本体。init / start / rebuild / doctor / devices の解析、QR 描画、
        コンソールUI、ライフサイクル統括を担う。

        【CLI 体験・エラー処理】
        - エラーメッセージの行動可能性。失敗時に「何が起きたか」だけでなく「次に何をすれば
          よいか」を示しているか。doctor への案内など次のアクションに繋がっているか。
        - 終了コードの一貫性。成功 0 / 失敗 非0 が全コマンドで守られ、CI から呼べる形に
          なっているか。
        - 引数・オプションの検証。不正な引数を黙って無視していないか、ヘルプと実装が
          一致しているか。
        - シグナル・中断時の後始末。Ctrl+C や SIGTERM で server / 子プロセス / 一時ファイルが
          取り残されないか。

        【構造・表示】
        - ビジネスロジックの流出防止。ビルドやサーバ制御のロジックが CLI 層に漏れていないか
          （fluse_builder / fluse_server に属すべき処理）。
        - 出力のハードコーディング。ユーザー向け文言・色・アイコンが散在していないか、
          文言が一貫しているか。
        - 非 TTY / リダイレクト対応。ANSI エスケープや QR 描画がパイプ経由や CI 環境で
          壊れないか。
        - 進捗表示と実態の一致。スピナーやステータス表示が実際の状態遷移とずれていないか、
          終了時に消されるか。

    - path: "packages/fluse_runtime/**"
      instructions: |
        ユーザープロジェクトの dev_dependencies に入る端末側ランタイム。接続・トンネル・
        エラー表示を担う。利用者のアプリに同居するため、他パッケージより制約が厳しい。

        - 依存の軽さ・侵食防止。不要な依存追加をしていないか。fluse_server / fluse_builder /
          fluse_cli への依存が入っていないか（依存してよいのは fluse_protocol まで）。
        - 本番ビルドへの混入防止。dev_dependencies 前提のコードが release ビルドに残らないか、
          デバッグ専用処理が kDebugMode 等でガードされているか。
        - 接続の失敗・再接続処理。切断時のリトライにバックオフがあるか、無限ループに
          ならないか、端末のバッテリーを食いつぶさないか。
        - エラー表示の安全性と分かりやすさ。端末画面に出すエラーに接続トークンや絶対パス等の
          機密情報が含まれないか、かつ原因が利用者に伝わるか。

    - path: "examples/counter_app/lib/**"
      instructions: |
        fluse の使い方を示すサンプル Flutter アプリ。自動生成ベースであり、
        プロダクションコードとは基準を変えて扱うこと。

        - レビュー強度を下げること。命名・整形・好みのレベルのスタイル指摘は行わない。
        - ただし実害のある問題は指摘すること。dispose 漏れ、リソースリーク、不要な rebuild を
          招く実装、誤動作に繋がるバグは対象とする。
        - サンプルとしての分かりやすさを優先すること。過剰な抽象化や高度なテクニックが
          持ち込まれている場合は、素直な実装に戻すよう提案すること。
        - fluse 導入手順との一致。README や設計文書に書かれた導入手順（dev_dependencies への
          fluse_runtime 追加など）と実際のサンプルがずれていないか確認すること。

    - path: "**/test/**"
      instructions: |
        - 意味のあるアサーション。型や存在を見るだけでなく振る舞いを検証しているか。
          実装がどう変わっても常に通ってしまうテストになっていないか。
        - 過剰なモックを避けること。実装を丸ごとモックして実質何もテストしていないパターンを
          指摘する。特に fluse_protocol の符号化・復号は実物で round-trip 検証すべき。
        - 異常系・境界値の網羅。接続失敗、不正フレーム、タイムアウト、切断・再接続などの
          異常経路がテストされているか。
        - テストの独立性・再現性。実行順序依存、共有状態、実時間の sleep 待ちによる
          flaky なテストを指摘すること。

  finishing_touches:
    simplify:
      enabled: true
    custom:
      - name: "コメントを日本語に統一"
        instructions: |
          変更されたファイルの Dart コメント（`//`、`///`、`/* */`）のうち英語で書かれている
          ものを、リポジトリ規約に合わせて日本語に書き換えること。dartdoc（`///`）の内容も
          日本語にする。
          コードの識別子・文字列リテラル・ライセンスヘッダは変更しないこと。
          訳文は技術文書として自然な日本語にし、原文の情報を落とさないこと。

  pre_merge_checks:
    # mode を書いていないチェックは既定の warning のまま。
    docstrings:
      threshold: 70
    title:
      requirements: |
        既存コミットに合わせ `[Task X.Y] 日本語の要約` 形式にすること。
        タスク番号が無い変更は `[Fix]` / `[Docs]` / `[Chore]` 等の接頭辞を付ける。
        要約は日本語で、タイトル全体を 60 文字以内に収めること。
    issue_assessment:
      mode: "error"
    custom_checks:
      - name: "secret 非混入"
        mode: "error"
        instructions: |
          差分に機密情報が含まれていないことを検査する。
          以下のいずれかに該当したら fail とする。
          - keystore のパスワード、キーエイリアスのパスワード、署名鍵の内容が文字列リテラル
            として追加されている。
          - API キー、アクセストークン、接続トークンに相当する値が文字列リテラルとして
            追加されている。
          - `.jks` / `.keystore` / `.p12` / `.pem` などの鍵ファイルそのものが追加されている。
          - `.flutter_preview/` 配下のファイルが追加されている。
          テスト用のダミー値であっても、実在の鍵と区別できない形式であれば fail とする。
          上記のいずれにも該当しない場合は pass とする。

      - name: "プロトコル互換性の明示"
        mode: "error"
        instructions: |
          packages/fluse_protocol/ 配下のメッセージ定義・フレーム定義・列挙型が変更されている
          PR に対して適用する。それ以外の PR は無条件で pass とする。
          対象の PR では、以下のいずれかが満たされていれば pass、いずれも満たされなければ
          fail とする。
          - プロトコルバージョンを表す定数が同じ PR 内で更新されている。
          - PR 本文またはコード内コメントに、後方互換性が保たれる理由、または非互換である
            ことと その移行方法が明記されている。

      - name: "workspace 登録"
        mode: "error"
        instructions: |
          packages/ 配下に新しいパッケージディレクトリ（新規の pubspec.yaml）が追加されている
          PR に対して適用する。それ以外の PR は無条件で pass とする。
          対象の PR では、ルート pubspec.yaml の `workspace:` リストに、追加された全パッケージ
          のパスが記載されていれば pass、1 つでも記載が無ければ fail とする。
